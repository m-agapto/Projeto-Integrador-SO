<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agendador Web{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}"><span class="brand-icon">⌘</span> Agendador<span class="brand-light">Web</span></a>
    <nav><a href="{{ url_for('main.index') }}">Painel</a><a href="{{ url_for('main.export_csv') }}">Exportar CSV</a></nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}<div class="messages">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Agendador Web de Tarefas · Projeto acadêmico</footer>
</body>
</html>
